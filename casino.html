<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Casino</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;user-select:none;font-family:'Segoe UI',sans-serif}
        body{background:#0a0a0f;color:#fff;min-height:100vh;display:flex;flex-direction:column;padding-bottom:70px}
        .page{display:none;flex-direction:column;flex:1;padding:20px}
        .page.active{display:flex}
        .page-title{font-size:24px;font-weight:700;margin-bottom:16px;color:#f0b90b}
        .menu-hero{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
        .menu-hero h1{font-size:48px;font-weight:900;color:#f0b90b;text-shadow:0 0 40px rgba(240,185,11,0.4)}
        .menu-hero .subtitle{color:#aaa;font-size:16px;margin-top:8px}
        .menu-hero .balance-big{margin-top:30px;background:#1a1a24;padding:16px 30px;border-radius:16px;border:1px solid #2a2a3a;font-size:28px;color:#f0b90b;font-weight:700}
        .profile-card{background:#1a1a24;border-radius:16px;padding:16px 18px;margin-bottom:10px;border:1px solid #2a2a3a}
        .profile-card .label{color:#888;font-size:12px;text-transform:uppercase}
        .profile-card .value{font-size:18px;font-weight:600;color:#fff;margin-top:2px}
        .profile-card .balance{font-size:26px;font-weight:700;color:#f0b90b}
        .wallet-row{display:flex;gap:10px;margin-top:6px}
        .wallet-row .input-field{flex:1}
        .wallet-row .btn{width:auto;padding:12px 18px;margin-top:0}
        .btn{display:inline-block;padding:12px 20px;border-radius:12px;font-weight:600;font-size:15px;text-align:center;border:none;cursor:pointer;transition:all .15s ease;width:100%;margin-top:6px;background:#2a2a3a;color:#fff}
        .btn-primary{background:#f0b90b;color:#0a0a0f}
        .btn-primary:active{background:#d4a40a}
        .btn-secondary{background:#1a1a24;border:1px solid #f0b90b;color:#f0b90b}
        .btn-secondary:active{background:#2a2a3a}
        .btn-outline{background:transparent;border:1px solid #444;color:#aaa}
        .btn-outline:active{background:#1a1a24}
        .input-field{background:#0a0a0f;border:1px solid #2a2a3a;border-radius:12px;padding:12px 14px;color:#fff;font-size:14px;width:100%;outline:none}
        .input-field:focus{border-color:#f0b90b}
        .ref-link{background:#0a0a0f;padding:10px 14px;border-radius:10px;font-size:13px;color:#aaa;word-break:break-all;margin-top:6px;border:1px solid #1a1a24}
        .profile-actions{display:flex;flex-direction:column;gap:8px;margin-top:4px}
        .inventory-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
        .inventory-item{background:#1a1a24;border:1px solid #2a2a3a;border-radius:16px;padding:16px 8px;text-align:center}
        .inventory-item .icon{font-size:32px}
        .inventory-item .name{font-size:13px;color:#ccc;margin-top:4px}
        .inventory-item .count{font-size:12px;color:#888;margin-top:2px}
        .inventory-actions{display:flex;gap:10px;margin-top:16px}
        .inventory-actions .btn{margin-top:0}
        .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#0d0d14;border-top:1px solid #1a1a24;display:flex;justify-content:space-around;padding:6px 0 10px;z-index:100}
        .nav-item{display:flex;flex-direction:column;align-items:center;color:#666;font-size:11px;cursor:pointer;padding:4px 12px;background:none;border:none;font-family:inherit;flex:1;max-width:80px;transition:color .15s ease}
        .nav-item .nav-icon{font-size:26px;margin-bottom:2px}
        .nav-item.active{color:#f0b90b}
        .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1a1a24;border:1px solid #f0b90b;padding:12px 20px;border-radius:12px;color:#fff;font-weight:500;z-index:200;opacity:0;transition:opacity .3s ease;pointer-events:none;max-width:90%;text-align:center;font-size:14px}
        .toast.show{opacity:1}
        .toast.error{border-color:#ff4444}
        .toast.success{border-color:#44ff88}
        .top-balance{background:#0d0d14;padding:10px 16px;text-align:right;font-size:16px;color:#f0b90b;border-bottom:1px solid #1a1a24;font-weight:600}
        @media(max-width:400px){.inventory-grid{grid-template-columns:repeat(2,1fr)}}
    </style>
</head>
<body>
    <div id="toast" class="toast"></div>
    <div class="top-balance" id="top-balance">🪙 0</div>

    <div id="page-inventory" class="page">
        <div class="page-title">🎒 Инвентарь</div>
        <div class="inventory-grid">
            <div class="inventory-item"><div class="icon">🃏</div><div class="name">Карты</div><div class="count">x0</div></div>
            <div class="inventory-item"><div class="icon">🎲</div><div class="name">Кубики</div><div class="count">x0</div></div>
            <div class="inventory-item"><div class="icon">💰</div><div class="name">Монеты</div><div class="count">x0</div></div>
            <div class="inventory-item"><div class="icon">🎁</div><div class="name">Бонусы</div><div class="count">x0</div></div>
            <div class="inventory-item"><div class="icon">⭐</div><div class="name">Звёзды</div><div class="count">x0</div></div>
            <div class="inventory-item"><div class="icon">🏆</div><div class="name">Трофеи</div><div class="count">x0</div></div>
        </div>
        <div class="inventory-actions">
            <button class="btn btn-secondary" id="btn-shop">🛒 Магазин</button>
            <button class="btn btn-secondary" id="btn-open">📦 Открыть</button>
        </div>
    </div>

    <div id="page-menu" class="page active">
        <div class="menu-hero">
            <h1>🎰 CASINO</h1>
            <div style="font-size:56px;margin:16px 0;">🔥</div>
            <div class="subtitle">Добро пожаловать в казино</div>
            <div class="balance-big" id="menu-balance">🪙 0</div>
            <div style="margin-top:20px;color:#555;font-size:13px;">Выберите раздел внизу</div>
        </div>
    </div>

    <div id="page-profile" class="page">
        <div class="page-title">👤 Профиль</div>
        <div class="profile-card"><div class="label">Имя</div><div class="value" id="profile-name">Загрузка...</div></div>
        <div class="profile-card"><div class="label">ID</div><div class="value" id="profile-id">---</div></div>
        <div class="profile-card"><div class="label">Баланс</div><div class="balance" id="profile-balance">---</div></div>
        <div class="profile-card">
            <div class="label">USDT (TRC20)</div>
            <div class="wallet-row">
                <input type="text" class="input-field" id="wallet-input" placeholder="T...">
                <button class="btn btn-primary" id="btn-bind-wallet">Привязать</button>
            </div>
        </div>
        <div class="profile-actions">
            <button class="btn btn-primary" id="btn-deposit">💰 Пополнить</button>
            <button class="btn btn-secondary" id="btn-withdraw">💸 Вывести</button>
        </div>
        <div style="margin-top:16px;">
            <div style="color:#888;font-size:12px;text-transform:uppercase;">Реферальная ссылка</div>
            <div class="ref-link" id="ref-link">Загрузка...</div>
            <button class="btn btn-outline" id="btn-copy-ref" style="margin-top:6px;">📋 Копировать</button>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="nav-item" data-page="page-inventory" onclick="switchPage('page-inventory')">
            <span class="nav-icon">🎒</span><span>Инвентарь</span>
        </button>
        <button class="nav-item active" data-page="page-menu" onclick="switchPage('page-menu')">
            <span class="nav-icon">🏠</span><span>Меню</span>
        </button>
        <button class="nav-item" data-page="page-profile" onclick="switchPage('page-profile')">
            <span class="nav-icon">👤</span><span>Профиль</span>
        </button>
    </div>

    <script>
        const WEBAPP_URL = "https://sevelevd86-lgtm.github.io/musor_drop/";
        const BOT_USERNAME = "MusorDrop_ROBOT";

        let tgUser = window.Telegram.WebApp.initDataUnsafe?.user || { id: 0, username: "Guest" };
        let currentBalance = 0;

        window.switchPage = function(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            const target = document.getElementById(pageId);
            if (target) target.classList.add('active');
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            const activeBtn = document.querySelector(`.nav-item[data-page="${pageId}"]`);
            if (activeBtn) activeBtn.classList.add('active');
            if (pageId === 'page-profile') loadProfile();
            if (pageId === 'page-menu') {
                document.getElementById('menu-balance').textContent = '🪙 ' + currentBalance;
            }
        };

        function showToast(msg, type = 'info', duration = 3000) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + type;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => { t.classList.remove('show'); }, duration);
        }

        async function apiRequest(action, data = {}) {
            try {
                const payload = { action, user_id: tgUser.id, ...data };
                const resp = await fetch(WEBAPP_URL + '/webapp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                return await resp.json();
            } catch (e) {
                showToast('Ошибка соединения с сервером', 'error');
                return { status: 'error', message: 'Network error' };
            }
        }

        function updateBalanceUI(balance) {
            currentBalance = balance;
            document.getElementById('top-balance').textContent = '🪙 ' + currentBalance;
            document.getElementById('menu-balance').textContent = '🪙 ' + currentBalance;
            const pb = document.getElementById('profile-balance');
            if (pb) pb.textContent = currentBalance + ' 🪙';
        }

        async function loadProfile() {
            const result = await apiRequest('get_profile');
            if (result.status === 'ok') {
                document.getElementById('profile-name').textContent = result.username || 'Unknown';
                document.getElementById('profile-id').textContent = result.user_id || '---';
                updateBalanceUI(result.balance);
                if (result.wallet) document.getElementById('wallet-input').value = result.wallet;
                document.getElementById('ref-link').textContent = `https://t.me/${BOT_USERNAME}?start=ref${tgUser.id}`;
            } else {
                showToast('Ошибка загрузки профиля', 'error');
            }
        }

        document.getElementById('btn-shop')?.addEventListener('click', () => showToast('🛒 Магазин скоро откроется!', 'info', 2000));
        document.getElementById('btn-open')?.addEventListener('click', () => showToast('📦 У вас пока нет предметов', 'info', 2000));

        document.getElementById('btn-bind-wallet')?.addEventListener('click', async function() {
            const wallet = document.getElementById('wallet-input').value.trim();
            if (!wallet || wallet.length < 10) { showToast('Введите корректный адрес USDT TRC20', 'error'); return; }
            const result = await apiRequest('update_wallet', { wallet });
            showToast(result.message || (result.status === 'ok' ? '✅ Кошелек привязан!' : 'Ошибка'), result.status === 'ok' ? 'success' : 'error');
        });

        document.getElementById('btn-deposit')?.addEventListener('click', function() {
            showToast('💰 Пополнение через TRC20.\nАдрес: T9yD14Nj9j7xso4e8LG8k7u4LmE9qX8kZ9', 'info', 5000);
        });

        document.getElementById('btn-withdraw')?.addEventListener('click', async function() {
            const result = await apiRequest('withdraw');
            showToast(result.message || (result.status === 'ok' ? '✅ Заявка отправлена!' : 'Ошибка'), result.status === 'ok' ? 'success' : 'error');
            if (result.status === 'ok') loadProfile();
        });

        document.getElementById('btn-copy-ref')?.addEventListener('click', function() {
            const link = document.getElementById('ref-link').textContent;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(link).then(() => showToast('✅ Ссылка скопирована!', 'success'))
                    .catch(() => fallbackCopy(link));
            } else { fallbackCopy(link); }
        });

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            ta.remove();
            showToast('✅ Ссылка скопирована!', 'success');
        }

        window.Telegram.WebApp.ready();
        window.switchPage('page-menu');
        setTimeout(loadProfile, 500);
    </script>
</body>
</html>
