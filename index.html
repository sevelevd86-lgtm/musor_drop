<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Casino</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        body {
            background: #0a0a0f;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 70px;
        }
        .page {
            display: none;
            flex-direction: column;
            flex: 1;
            padding: 20px;
            padding-bottom: 10px;
        }
        .page.active {
            display: flex;
        }

        /* ========== ОБЩИЙ СТИЛЬ ========== */
        .page-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #f0b90b;
            text-shadow: 0 0 15px rgba(240, 185, 11, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .page-title span {
            font-size: 28px;
        }

        /* ========== МЕНЮ (ЦЕНТР) ========== */
        .menu-hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .menu-hero h1 {
            font-size: 48px;
            font-weight: 900;
            color: #f0b90b;
            text-shadow: 0 0 40px rgba(240, 185, 11, 0.4);
            letter-spacing: 4px;
        }
        .menu-hero .subtitle {
            color: #aaa;
            font-size: 16px;
            margin-top: 8px;
            letter-spacing: 2px;
        }
        .menu-hero .balance-big {
            margin-top: 30px;
            background: #1a1a24;
            padding: 16px 30px;
            border-radius: 16px;
            border: 1px solid #2a2a3a;
            font-size: 22px;
            color: #f0b90b;
        }

        /* ========== ИНВЕНТАРЬ ========== */
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 10px;
        }
        .inventory-item {
            background: #1a1a24;
            border: 1px solid #2a2a3a;
            border-radius: 16px;
            padding: 16px 8px;
            text-align: center;
            transition: all 0.2s;
        }
        .inventory-item:active {
            transform: scale(0.95);
            border-color: #f0b90b;
        }
        .inventory-item .icon {
            font-size: 32px;
            margin-bottom: 6px;
        }
        .inventory-item .name {
            font-size: 13px;
            color: #ccc;
        }
        .inventory-item .count {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
        .inventory-empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #666;
            text-align: center;
        }
        .inventory-empty-state .icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        .inventory-empty-state h2 {
            color: #888;
            font-weight: 400;
        }

        /* ========== ПРОФИЛЬ ========== */
        .profile-card {
            background: #1a1a24;
            border-radius: 16px;
            padding: 18px 20px;
            margin-bottom: 12px;
            border: 1px solid #2a2a3a;
        }
        .profile-card .label {
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .profile-card .value {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            margin-top: 2px;
        }
        .profile-card .balance {
            font-size: 28px;
            font-weight: 700;
            color: #f0b90b;
        }
        .profile-card .wallet-row {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }
        .profile-card .wallet-row .input-field {
            flex: 1;
        }
        .profile-card .wallet-row .btn {
            width: auto;
            padding: 12px 18px;
            margin-top: 0;
        }

        .btn {
            display: inline-block;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            text-align: center;
            border: none;
            cursor: pointer;
            transition: all 0.15s ease;
            width: 100%;
            margin-top: 6px;
            background: #2a2a3a;
            color: #fff;
        }
        .btn-primary {
            background: #f0b90b;
            color: #0a0a0f;
        }
        .btn-primary:active {
            background: #d4a40a;
        }
        .btn-secondary {
            background: #1a1a24;
            border: 1px solid #f0b90b;
            color: #f0b90b;
        }
        .btn-secondary:active {
            background: #2a2a3a;
        }
        .btn-success {
            background: #2ecc71;
            color: #0a0a0f;
        }
        .btn-success:active {
            background: #27ae60;
        }
        .btn-danger {
            background: #e74c3c;
            color: #fff;
        }
        .btn-danger:active {
            background: #c0392b;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #444;
            color: #aaa;
        }
        .btn-outline:active {
            background: #1a1a24;
        }

        .input-field {
            background: #0a0a0f;
            border: 1px solid #2a2a3a;
            border-radius: 12px;
            padding: 12px 14px;
            color: #fff;
            font-size: 14px;
            width: 100%;
            outline: none;
            transition: border 0.15s;
        }
        .input-field:focus {
            border-color: #f0b90b;
        }
        .input-field::placeholder {
            color: #555;
        }

        .ref-link {
            background: #0a0a0f;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            color: #aaa;
            word-break: break-all;
            margin-top: 6px;
            border: 1px solid #1a1a24;
        }

        .profile-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 4px;
        }
        .profile-actions .btn {
            margin-top: 0;
        }

        /* ========== НИЖНЯЯ НАВИГАЦИЯ ========== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0d0d14;
            border-top: 1px solid #1a1a24;
            display: flex;
            justify-content: space-around;
            padding: 6px 0 10px;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #666;
            font-size: 11px;
            transition: color 0.15s;
            cursor: pointer;
            padding: 4px 12px;
            background: none;
            border: none;
            font-family: inherit;
            flex: 1;
            max-width: 80px;
        }
        .nav-item .nav-icon {
            font-size: 26px;
            margin-bottom: 2px;
        }
        .nav-item.active {
            color: #f0b90b;
        }
        .nav-item:active {
            opacity: 0.6;
        }

        /* ========== TOAST ========== */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a24;
            border: 1px solid #f0b90b;
            padding: 12px 20px;
            border-radius: 12px;
            color: #fff;
            font-weight: 500;
            z-index: 200;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
            font-size: 14px;
        }
        .toast.show {
            opacity: 1;
        }
        .toast.error {
            border-color: #ff4444;
        }
        .toast.success {
            border-color: #44ff88;
        }

        /* ========== АДАПТИВ ========== */
        @media (max-width: 400px) {
            .inventory-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .menu-hero h1 {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>

    <div id="toast" class="toast"></div>

    <!-- ===== СТРАНИЦА: ИНВЕНТАРЬ ===== -->
    <div id="page-inventory" class="page">
        <div class="page-title"><span>🎒</span> Инвентарь</div>

        <!-- Сетка предметов (заглушка, но выглядит как настоящий инвентарь) -->
        <div class="inventory-grid">
            <div class="inventory-item">
                <div class="icon">🃏</div>
                <div class="name">Карты</div>
                <div class="count">x0</div>
            </div>
            <div class="inventory-item">
                <div class="icon">🎲</div>
                <div class="name">Кубики</div>
                <div class="count">x0</div>
            </div>
            <div class="inventory-item">
                <div class="icon">💰</div>
                <div class="name">Монеты</div>
                <div class="count">x0</div>
            </div>
            <div class="inventory-item">
                <div class="icon">🎁</div>
                <div class="name">Бонусы</div>
                <div class="count">x0</div>
            </div>
            <div class="inventory-item">
                <div class="icon">⭐</div>
                <div class="name">Звёзды</div>
                <div class="count">x0</div>
            </div>
            <div class="inventory-item">
                <div class="icon">🏆</div>
                <div class="name">Трофеи</div>
                <div class="count">x0</div>
            </div>
        </div>

        <!-- Кнопки действий -->
        <div style="margin-top: 16px; display: flex; gap: 10px;">
            <button class="btn btn-secondary" id="btn-shop">🛒 Магазин</button>
            <button class="btn btn-secondary" id="btn-open">📦 Открыть</button>
        </div>

        <div style="margin-top: 10px; text-align: center; color: #555; font-size: 13px;">
            Предметы появятся после игры
        </div>
    </div>

    <!-- ===== СТРАНИЦА: МЕНЮ (ЦЕНТР) ===== -->
    <div id="page-menu" class="page active">
        <div class="menu-hero">
            <h1>🎰 CASINO</h1>
            <div style="font-size: 56px; margin: 16px 0;">🔥</div>
            <div class="subtitle">Добро пожаловать в казино</div>
            <div class="balance-big" id="menu-balance">🪙 0</div>
            <div style="margin-top: 20px; color: #555; font-size: 13px;">Выберите раздел внизу</div>
        </div>
    </div>

    <!-- ===== СТРАНИЦА: ПРОФИЛЬ ===== -->
    <div id="page-profile" class="page">
        <div class="page-title"><span>👤</span> Профиль</div>

        <div class="profile-card">
            <div class="label">Имя</div>
            <div class="value" id="profile-name">Загрузка...</div>
        </div>
        <div class="profile-card">
            <div class="label">ID</div>
            <div class="value" id="profile-id">---</div>
        </div>
        <div class="profile-card">
            <div class="label">Баланс</div>
            <div class="balance" id="profile-balance">---</div>
        </div>

        <div class="profile-card">
            <div class="label">USDT (TRC20) кошелек</div>
            <div class="wallet-row">
                <input type="text" class="input-field" id="wallet-input" placeholder="T...">
                <button class="btn btn-primary" id="btn-bind-wallet">Привязать</button>
            </div>
        </div>

        <div class="profile-actions">
            <button class="btn btn-primary" id="btn-deposit">💰 Пополнить баланс</button>
            <button class="btn btn-secondary" id="btn-withdraw">💸 Вывести средства</button>
        </div>

        <div style="margin-top: 16px;">
            <div class="label" style="color:#888; font-size:12px; text-transform:uppercase;">Реферальная ссылка</div>
            <div class="ref-link" id="ref-link">Загрузка...</div>
            <button class="btn btn-outline" id="btn-copy-ref" style="margin-top:6px;">📋 Копировать</button>
        </div>
    </div>

    <!-- ===== НИЖНЯЯ НАВИГАЦИЯ ===== -->
    <div class="bottom-nav">
        <button class="nav-item" data-page="page-inventory" id="nav-inventory">
            <span class="nav-icon">🎒</span>
            <span>Инвентарь</span>
        </button>
        <button class="nav-item active" data-page="page-menu" id="nav-menu">
            <span class="nav-icon">🏠</span>
            <span>Меню</span>
        </button>
        <button class="nav-item" data-page="page-profile" id="nav-profile">
            <span class="nav-icon">👤</span>
            <span>Профиль</span>
        </button>
    </div>

    <script>
        // ---------- НАСТРОЙКИ ----------
        const WEBAPP_URL = "https://sevelevd86-lgtm.github.io/musor_drop/";
        const BOT_USERNAME = "MusorDrop_ROBOT";

        let tgUser = window.Telegram.WebApp.initDataUnsafe?.user || { id: 0, username: "Guest" };
        let currentBalance = 0;

        // ---------- ЭЛЕМЕНТЫ ----------
        const pages = {
            inventory: document.getElementById('page-inventory'),
            menu: document.getElementById('page-menu'),
            profile: document.getElementById('page-profile')
        };
        const navItems = document.querySelectorAll('.nav-item');
        const toast = document.getElementById('toast');
        const menuBalance = document.getElementById('menu-balance');

        // ---------- ТОСТ ----------
        function showToast(message, type = 'info', duration = 3000) {
            toast.textContent = message;
            toast.className = 'toast ' + type;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => {
                toast.classList.remove('show');
            }, duration);
        }

        // ---------- API ----------
        async function apiRequest(action, data = {}) {
            try {
                const payload = { action, user_id: tgUser.id, ...data };
                const resp = await fetch(WEBAPP_URL + '/webapp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                return await resp.json();
            } catch (e) {
                showToast('Ошибка соединения с сервером', 'error');
                return { status: 'error', message: 'Network error' };
            }
        }

        // ---------- ЗАГРУЗКА ПРОФИЛЯ ----------
        async function loadProfile() {
            const result = await apiRequest('get_profile');
            if (result.status === 'ok') {
                document.getElementById('profile-name').textContent = result.username || 'Unknown';
                document.getElementById('profile-id').textContent = result.user_id || '---';
                document.getElementById('profile-balance').textContent = result.balance + ' 🪙';
                currentBalance = result.balance;
                menuBalance.textContent = '🪙 ' + currentBalance;
                if (result.wallet) {
                    document.getElementById('wallet-input').value = result.wallet;
                }
                const refLink = `https://t.me/${BOT_USERNAME}?start=ref${tgUser.id}`;
                document.getElementById('ref-link').textContent = refLink;
            } else {
                showToast('Ошибка загрузки профиля', 'error');
            }
        }

        // ---------- ПЕРЕКЛЮЧЕНИЕ СТРАНИЦ ----------
        function showPage(pageId) {
            // Скрываем все
            Object.keys(pages).forEach(key => {
                pages[key].classList.remove('active');
            });
            // Показываем нужную
            if (pages[pageId]) {
                pages[pageId].classList.add('active');
            }

            // Обновляем активную кнопку
            navItems.forEach(item => {
                item.classList.remove('active');
                if (item.dataset.page === pageId) {
                    item.classList.add('active');
                }
            });

            // Если открыли профиль — загружаем данные
            if (pageId === 'profile') {
                loadProfile();
            }
            // Если открыли меню — обновляем баланс
            if (pageId === 'menu') {
                menuBalance.textContent = '🪙 ' + currentBalance;
            }
        }

        // ---------- ОБРАБОТЧИКИ КНОПОК ----------
        navItems.forEach(item => {
            item.addEventListener('click', () => {
                const pageId = item.dataset.page;
                if (pageId) {
                    showPage(pageId);
                }
            });
        });

        // ---------- КНОПКИ ИНВЕНТАРЯ ----------
        document.getElementById('btn-shop').addEventListener('click', () => {
            showToast('🛒 Магазин скоро откроется!', 'info', 2000);
        });
        document.getElementById('btn-open').addEventListener('click', () => {
            showToast('📦 У вас пока нет предметов для открытия', 'info', 2000);
        });

        // ---------- КНОПКИ ПРОФИЛЯ ----------
        document.getElementById('btn-bind-wallet').addEventListener('click', async () => {
            const wallet = document.getElementById('wallet-input').value.trim();
            if (!wallet || wallet.length < 10) {
                showToast('Введите корректный адрес USDT TRC20', 'error');
                return;
            }
            const result = await apiRequest('update_wallet', { wallet });
            showToast(result.message || (result.status === 'ok' ? '✅ Кошелек привязан!' : 'Ошибка'), result.status === 'ok' ? 'success' : 'error');
        });

        document.getElementById('btn-deposit').addEventListener('click', () => {
            showToast('💰 Пополнение через крипто-кошелек TRC20.\nАдрес: T9yD14Nj9j7xso4e8LG8k7u4LmE9qX8kZ9', 'info', 5000);
        });

        document.getElementById('btn-withdraw').addEventListener('click', async () => {
            const result = await apiRequest('withdraw');
            showToast(result.message || (result.status === 'ok' ? '✅ Заявка отправлена!' : 'Ошибка'), result.status === 'ok' ? 'success' : 'error');
            if (result.status === 'ok') loadProfile();
        });

        document.getElementById('btn-copy-ref').addEventListener('click', () => {
            const link = document.getElementById('ref-link').textContent;
            navigator.clipboard.writeText(link).then(() => {
                showToast('✅ Ссылка скопирована!', 'success');
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = link;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
                showToast('✅ Ссылка скопирована!', 'success');
            });
        });

        // ---------- ИНИЦИАЛИЗАЦИЯ ----------
        window.Telegram.WebApp.ready();

        // Показываем меню по умолчанию
        showPage('page-menu');

        // Загружаем профиль при старте
        setTimeout(() => {
            loadProfile();
        }, 500);
    </script>
</body>
</html>
